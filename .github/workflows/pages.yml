# Publishes the ready-built demo (frontend/dist) to GitHub Pages. It runs ONLY when you press "Run workflow"
# in the Actions tab, so nothing fails by itself. The page uses the bundled Demo Mission snapshot (no backend).
# Before the first run: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy demo to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
